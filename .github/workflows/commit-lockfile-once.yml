name: commit-lockfile-once

on:
  push:
    branches:
      - hardening/local-daemon-client-v1

permissions:
  contents: write

jobs:
  commit-lockfile:
    if: github.repository == 'iso-lattes/isl-desktop-cli'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: hardening/local-daemon-client-v1
          persist-credentials: true
      - name: Install declared MSRV
        shell: bash
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Generate and commit deterministic lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.90.0 generate-lockfile
          git rm .github/workflows/commit-lockfile-once.yml
          git add Cargo.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: commit deterministic Cargo.lock'
          git push origin HEAD:hardening/local-daemon-client-v1
